stages:
  - test

variables:
  POSTGRES_DB: qa-sql-lab
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: qa-sql-lab
  PGUSER: postgres
  PGPASSWORD: postgres

postgresql-validation:
  stage: test
  image: postgres:16-alpine
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
  services:
    - name: postgres:16-alpine
      alias: postgres
  before_script:
    - timeout -k 5 60 sh -c 'until pg_isready; do sleep 1; done'
  script:
    - psql --set=ON_ERROR_STOP=1 --file=tests/run_all.sql
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
